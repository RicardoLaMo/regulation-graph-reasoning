name: Test Generated Code

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Always install basic testing tools
        pip install pytest pytest-cov flake8 black mypy
        # Install project requirements if they exist
        if [ -f requirements.txt ]; then 
          echo "Installing project requirements..."
          pip install -r requirements.txt
        else
          echo "⚠️ No requirements.txt found - installing minimal dependencies"
          pip install pandas numpy
        fi
        if [ -f requirements-dev.txt ]; then 
          echo "Installing dev requirements..."
          pip install -r requirements-dev.txt
        fi
    
    - name: Format check with Black
      run: |
        if [ -d src ]; then black --check src/; fi
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        if [ -d src ]; then flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics; fi
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        if [ -d src ]; then mypy src/ --ignore-missing-imports; fi
      continue-on-error: true
    
    - name: Run tests with pytest
      run: |
        if [ -d tests ]; then
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
        else
          echo "No tests directory found yet"
        fi
    
    - name: Validate against specifications
      run: |
        if [ -f scripts/validate_spec_compliance.py ]; then
          python scripts/validate_spec_compliance.py
        else
          echo "Spec validation script not found yet"
        fi
      continue-on-error: true
    
    - name: Upload coverage reports
      if: always()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🤖 Automated Test Results\n\n';
          comment += '✅ Tests completed for Python ${{ matrix.python-version }}\n';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          })
      continue-on-error: true
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regulation-graph-reasoning"
version = "0.1.0"
description = "Structured + grounded + causal CFPB complaint reasoning with conformal calibration."
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Richard Liu" }]
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=15",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.7",
    "rank-bm25>=0.2",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires SBERT model load"]
